<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1e293b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <title>كشف حساب الأقساط - مركز الراشد</title>
  
  <!-- ربط ملف الـ Manifest للتطبيق -->
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts: Cairo & Roboto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Roboto:wght@500;700;900&display=swap" rel="stylesheet">

  <!-- Firebase SDK (Compat Version 9.23.0) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>

  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --primary: #0f172a;
      --brand-blue: #1e40af;
      --accent: #4f46e5;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #cbd5e1;
      
      --paid-bg: #dcfce7;
      --paid-text: #15803d;
      --paid-border: #86efac;
      
      --due-bg: #fee2e2;
      --due-text: #b91c1c;
      --due-border: #fca5a5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      background-color: var(--bg); 
      color: var(--text-main); 
      font-family: 'Cairo', sans-serif; 
      padding: 12px;
      -webkit-tap-highlight-color: transparent;
    }

    .num {
      font-family: 'Roboto', 'Inter', system-ui, sans-serif !important;
      direction: ltr;
      display: inline-block;
      font-weight: 700;
    }

    .container { 
      max-width: 800px; 
      margin: 0 auto; 
      background: var(--card); 
      padding: 18px; 
      border-radius: 20px; 
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); 
      position: relative;
    }

    /* شريط تثبيت التطبيق PWA Banner */
    .install-banner {
      position: fixed;
      bottom: 15px;
      left: 15px;
      right: 15px;
      max-width: 770px;
      margin: 0 auto;
      background: #0f172a;
      color: #ffffff;
      padding: 14px 18px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      z-index: 9999;
      animation: slideUp 0.4s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .install-banner-text { font-size: 0.88rem; font-weight: 700; }
    .install-banner-btns { display: flex; gap: 8px; align-items: center; }
    .btn-install { background: #2563eb; color: #fff; border: none; padding: 8px 16px; border-radius: 10px; font-weight: 800; font-family: 'Cairo'; cursor: pointer; }
    .btn-close-banner { background: transparent; color: #94a3b8; border: none; font-size: 1.2rem; cursor: pointer; padding: 0 6px; }

    /* Top Brand Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 2px dashed var(--border);
      margin-bottom: 18px;
    }
    .brand-title { font-size: 1.4rem; font-weight: 900; color: var(--brand-blue); line-height: 1.2; }
    .brand-sub { font-size: 0.78rem; color: var(--text-muted); font-weight: 600; margin-top: 3px; }
    .logo-badge {
      background: #0f172a;
      color: #38bdf8;
      font-weight: 900;
      font-size: 1.2rem;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.15);
      flex-shrink: 0;
    }

    /* حالة التوصيل بالإشعارات */
    .notif-bar {
      margin-bottom: 15px;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .notif-bar.active { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
    .notif-bar.inactive { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
    .btn-enable-notif { background: #b45309; color: #fff; border: none; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-weight: 700; font-family: 'Cairo'; }

    /* Summary Dashboard Cards */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .sum-card {
      padding: 14px 8px;
      border-radius: 14px;
      text-align: center;
      border: 1px solid transparent;
    }
    .sum-card.total { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; }
    .sum-card.paid { background: var(--paid-bg); border-color: var(--paid-border); color: var(--paid-text); }
    .sum-card.remaining { background: var(--due-bg); border-color: var(--due-border); color: var(--due-text); }
    
    .sum-label { font-size: 0.8rem; font-weight: 700; margin-bottom: 4px; opacity: 0.9; }
    .sum-val { font-size: 1.15rem; font-weight: 900; }

    /* Client Details Grid */
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 22px;
    }
    .info-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }
    .box-head {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.88rem;
    }
    .info-row:last-child { margin-bottom: 0; }
    .lbl { color: var(--text-muted); font-weight: 600; }
    .val { font-weight: 700; color: var(--text-main); text-align: left; }

    .section-header {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .mobile-list { display: flex; flex-direction: column; gap: 10px; }
    
    .install-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .install-card.is-paid { border-right: 6px solid var(--paid-text); background: #f0fdf4; }
    .install-card.is-due { border-right: 6px solid var(--due-text); background: #fff; }
    .install-card.is-deposit { border-right: 6px solid #3b82f6; background: #f0f9ff; }

    .card-right { display: flex; flex-direction: column; gap: 4px; }
    .card-title-text { font-size: 0.95rem; font-weight: 800; color: var(--text-main); }
    .card-date-text { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }

    .card-left { text-align: left; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .card-amount { font-size: 1.05rem; font-weight: 900; color: var(--text-main); }
    
    .badge-status {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 800;
      display: inline-block;
    }
    .badge-status.paid { background: var(--paid-bg); color: var(--paid-text); border: 1px solid var(--paid-border); }
    .badge-status.due { background: var(--due-bg); color: var(--due-text); border: 1px solid var(--due-border); }
    .badge-status.deposit { background: #dbeafe; color: #1e40af; border: 1px solid #bfdbfe; }

    .desktop-table { display: none; }

    /* شاشة إدخال رقم الحساب عند عدم توفر الـ ID */
    .login-box {
      text-align: center;
      padding: 30px 15px;
    }
    .login-box h2 { font-weight: 900; color: var(--brand-blue); margin-bottom: 8px; }
    .login-box p { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 20px; font-weight: 600; }
    .login-input {
      width: 100%;
      max-width: 320px;
      padding: 12px;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 1.1rem;
      text-align: center;
      font-family: 'Roboto', sans-serif;
      font-weight: 700;
      margin-bottom: 15px;
      outline: none;
    }
    .login-input:focus { border-color: var(--brand-blue); }
    .btn-login {
      background: var(--brand-blue);
      color: #fff;
      border: none;
      padding: 12px 30px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 800;
      font-family: 'Cairo';
      cursor: pointer;
      width: 100%;
      max-width: 320px;
    }
    .btn-logout {
      background: #ef4444;
      color: white;
      border: none;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      font-family: 'Cairo';
      cursor: pointer;
    }

    .footer {
      margin-top: 25px;
      padding-top: 15px;
      border-top: 2px dashed var(--border);
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    .loading, .error-msg { text-align: center; padding: 40px 10px; font-weight: 800; font-size: 1.1rem; }
    .error-msg { color: var(--due-text); }

    @media (min-width: 640px) {
      body { padding: 25px; }
      .container { padding: 25px; }
      .mobile-list { display: none; }
      .desktop-table { display: table; width: 100%; border-collapse: collapse; text-align: center; font-size: 0.9rem; }
      .desktop-table th { background: var(--brand-blue); color: #fff; padding: 12px 8px; font-weight: 700; }
      .desktop-table th:first-child { border-radius: 0 10px 10px 0; }
      .desktop-table th:last-child { border-radius: 10px 0 0 10px; }
      .desktop-table td { padding: 12px 8px; border-bottom: 1px solid var(--border); font-weight: 600; }
    }

    @media (max-width: 480px) {
      .info-grid { grid-template-columns: 1fr; }
      .sum-val { font-size: 0.95rem; }
      .sum-label { font-size: 0.72rem; }
      .brand-title { font-size: 1.2rem; }
    }
  </style>
</head>
<body>

  <!-- بنر تثبيت التطبيق -->
  <div id="pwa-install-banner" class="install-banner" style="display: none;">
    <div class="install-banner-text">📲 احفظ التطبيق على هاتفك للوصول السريع واستلام الإشعارات!</div>
    <div class="install-banner-btns">
      <button id="btn-install-app" class="btn-install">تثبيت</button>
      <button id="btn-close-banner" class="btn-close-banner">✕</button>
    </div>
  </div>

  <div class="container" id="app">
    <div class="loading">جاري تحضير كشف الحساب...</div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC6nz1_dENnayngLi1iiq8KDOKQmbfwNDI",
      authDomain: "rashedshopv1.firebaseapp.com",
      databaseURL: "https://rashedshopv1-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "rashedshopv1",
      storageBucket: "rashedshopv1.firebasestorage.app",
      messagingSenderId: "946603870783",
      appId: "1:946603870783:web:59aaa8549fab98635fc68a"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const appContainer = document.getElementById('app');

    // 1. إدارة جلسة معرف الزبون (LocalStorage & URL)
    const urlParams = new URLSearchParams(window.location.search);
    let customerId = urlParams.get('id');

    if (customerId) {
      localStorage.setItem('alrashed_cust_id', customerId);
    } else {
      customerId = localStorage.getItem('alrashed_cust_id');
    }

    if (!customerId) {
      renderLoginScreen();
    } else {
      fetchCustomerData(customerId);
    }

    function renderLoginScreen() {
      appContainer.innerHTML = `
        <div class="header">
          <div>
            <div class="brand-title">مركز الراشد</div>
            <div class="brand-sub">نظام كشف أقساط الأجهزة</div>
          </div>
          <div class="logo-badge">5G</div>
        </div>
        <div class="login-box">
          <h2>تسجيل الدخول إلى حسابك</h2>
          <p>يرجى إدخال رمز الحساب الخاص بك لمتابعة أقساطك:</p>
          <input type="text" id="cust-id-input" class="login-input" placeholder="مثال: cust_1787425280099">
          <br>
          <button class="btn-login" onclick="handleManualLogin()">دخول للحساب</button>
        </div>
      `;
    }

    function handleManualLogin() {
      const inputVal = document.getElementById('cust-id-input').value.trim();
      if (!inputVal) {
        alert('يرجى كتابة رمز الحساب أولاً');
        return;
      }
      localStorage.setItem('alrashed_cust_id', inputVal);
      customerId = inputVal;
      appContainer.innerHTML = `<div class="loading">جاري تحضير كشف الحساب...</div>`;
      fetchCustomerData(customerId);
    }

    function handleLogout() {
      if (confirm('هل أنت تأكد من الخروج من هذا الحساب؟')) {
        localStorage.removeItem('alrashed_cust_id');
        window.location.href = window.location.pathname;
      }
    }

    // 2. جلب البيانات وتحديث التوكن
    let detectedNodePath = '';

    function fetchCustomerData(id) {
      db.ref('customers/' + id).once('value')
        .then(snapshot => {
          if (snapshot.exists()) {
            detectedNodePath = 'customers/' + id;
            return snapshot;
          }
          detectedNodePath = 'installments/customers/' + id;
          return db.ref(detectedNodePath).once('value');
        })
        .then(snapshot => {
          if (!snapshot || !snapshot.exists()) {
            appContainer.innerHTML = `
              <div class="error-msg">
                عذراً، لم يتم العثور على حساب بهذا الرمز.
                <br><br>
                <button class="btn-logout" onclick="handleLogout()">إعادة المحاولة</button>
              </div>`;
            return;
          }
          renderCustomerPortal(snapshot.val(), id);
          setupNotifications(id, detectedNodePath);
        })
        .catch(error => {
          console.error(error);
          appContainer.innerHTML = `<div class="error-msg">حدث خطأ أثناء تحميل البيانات، يرجى المحاولة لاحقاً.</div>`;
        });
    }

    // 3. إعداد إشعارات الهاتف (FCM)
    async function setupNotifications(id, nodePath) {
      if (!('serviceWorker' in navigator) || !('Notification' in window)) return;

      try {
        const reg = await navigator.serviceWorker.register('firebase-messaging-sw.js');
        const messaging = firebase.messaging();

        if (Notification.permission === 'granted') {
          saveToken(messaging, reg, id, nodePath);
        } else if (Notification.permission !== 'denied') {
          // طلب الإذن تلقائياً
          const perm = await Notification.requestPermission();
          if (perm === 'granted') {
            saveToken(messaging, reg, id, nodePath);
          }
        }
      } catch (err) {
        console.error('Service Worker / FCM Error:', err);
      }
    }

    async function requestNotifPermission() {
      if (!('serviceWorker' in navigator)) return;
      const reg = await navigator.serviceWorker.ready;
      const messaging = firebase.messaging();
      const perm = await Notification.requestPermission();
      if (perm === 'granted') {
        saveToken(messaging, reg, customerId, detectedNodePath);
      }
    }

    async function saveToken(messaging, reg, id, nodePath) {
      try {
        const token = await messaging.getToken({ serviceWorkerRegistration: reg });
        if (token) {
          const updates = {};
          updates[nodePath + '/fcmToken'] = token;
          updates[nodePath + '/tokenUpdatedAt'] = Date.now();
          await db.ref().update(updates);
          updateNotifUI(true);
        }
      } catch (err) {
        console.error('Failed to get FCM token:', err);
      }
    }

    function updateNotifUI(isOnline) {
      const notifEl = document.getElementById('notif-status-box');
      if (!notifEl) return;
      if (isOnline) {
        notifEl.className = 'notif-bar active';
        notifEl.innerHTML = `<span>🔔 الإشعارات مفعلة على هذا الهاتف</span> <span>متصل</span>`;
      } else {
        notifEl.className = 'notif-bar inactive';
        notifEl.innerHTML = `
          <span>🔕 الإشعارات متوقفة</span>
          <button class="btn-enable-notif" onclick="requestNotifPermission()">تفعيل الآن</button>
        `;
      }
    }

    function formatDate(dateVal) {
      if (!dateVal || dateVal === '--') return '--';
      if (typeof dateVal === 'number' || !isNaN(dateVal)) {
        const d = new Date(Number(dateVal));
        if (!isNaN(d.getTime())) {
          return d.toISOString().split('T')[0];
        }
      }
      return dateVal;
    }

    // 4. بناء واجهة كشف الحساب
    function renderCustomerPortal(data, id) {
      const name = data.name || 'غير محدد';
      const phone = data.phone || 'غير محدد';
      const address = data.address || 'الزبير - حي الشهداء';
      
      const itemName = data.model || 'غير محدد';
      const buyDate = formatDate(data.purchaseDate);
      const downPayment = Number(data.firstPay || 0);

      const totalAmount = Number(data.total || 0);

      let monthsList = [];
      if (data.months) {
        monthsList = Array.isArray(data.months) ? data.months : Object.values(data.months);
      }

      let totalPaidFromMonths = 0;
      let mobileCardsHtml = '';
      let desktopRowsHtml = '';

      if (downPayment > 0) {
        mobileCardsHtml += `
          <div class="install-card is-deposit">
            <div class="card-right">
              <span class="card-title-text">المقدمة (دفعة أولى)</span>
              <span class="card-date-text">تاريخ الدفع: <span class="num">${buyDate}</span></span>
            </div>
            <div class="card-left">
              <span class="card-amount"><span class="num">${downPayment.toLocaleString()}</span> د.ع</span>
              <span class="badge-status deposit">واصل ✓</span>
            </div>
          </div>
        `;

        desktopRowsHtml += `
          <tr>
            <td>--</td>
            <td><span class="num">${buyDate}</span></td>
            <td><span class="num">${buyDate}</span></td>
            <td>المقدمة</td>
            <td><span class="num">${downPayment.toLocaleString()}</span> د.ع</td>
            <td><span class="badge-status deposit">واصل ✓</span></td>
          </tr>
        `;
      }

      monthsList.forEach((m) => {
        const reqAmount = Number(m.required || m.amount || 0);
        const remAmount = Number(m.remaining !== undefined ? m.remaining : reqAmount);
        const paidForThisMonth = reqAmount - remAmount;
        
        totalPaidFromMonths += paidForThisMonth;

        const dueDateFormatted = formatDate(m.dueDate);
        const isPaid = (m.status && m.status.toLowerCase() === 'paid') || remAmount === 0;
        const isPartiallyPaid = paidForThisMonth > 0 && remAmount > 0;

        let statusBadgeMobile = '';
        let statusBadgeDesktop = '';
        let cardClass = '';

        if (isPaid) {
          statusBadgeMobile = `<span class="badge-status paid">واصل ✓</span>`;
          statusBadgeDesktop = `<span class="badge-status paid">واصل ✓</span>`;
          cardClass = 'is-paid';
        } else if (isPartiallyPaid) {
          statusBadgeMobile = `<span class="badge-status paid">واصل جزئي</span>`;
          statusBadgeDesktop = `<span class="badge-status paid">واصل جزئي</span>`;
          cardClass = 'is-paid';
        } else {
          statusBadgeMobile = `<span class="badge-status due">مستحق</span>`;
          statusBadgeDesktop = `<span class="badge-status due">مستحق</span>`;
          cardClass = 'is-due';
        }

        const payDateFormatted = isPaid ? (formatDate(m.paidAt) || dueDateFormatted) : '--';

        mobileCardsHtml += `
          <div class="install-card ${cardClass}">
            <div class="card-right">
              <span class="card-title-text">قسط شهر (${m.monthNumber || '1'})</span>
              <span class="card-date-text">استحقاق: <span class="num">${dueDateFormatted}</span></span>
            </div>
            <div class="card-left">
              <span class="card-amount"><span class="num">${reqAmount.toLocaleString()}</span> د.ع</span>
              ${statusBadgeMobile}
            </div>
          </div>
        `;

        desktopRowsHtml += `
          <tr>
            <td><span class="num">${m.monthNumber || '--'}</span></td>
            <td><span class="num">${dueDateFormatted}</span></td>
            <td><span class="num">${payDateFormatted}</span></td>
            <td><span class="num">${reqAmount.toLocaleString()}</span> د.ع</td>
            <td><span class="num">${paidForThisMonth.toLocaleString()}</span> د.ع</td>
            <td>${statusBadgeDesktop}</td>
          </tr>
        `;
      });

      const totalPaid = downPayment + totalPaidFromMonths;
      const remainingAmount = totalAmount - totalPaid;
      const hasToken = !!data.fcmToken;

      appContainer.innerHTML = `
        <div class="header">
          <div>
            <div class="brand-title">مركز الراشد</div>
            <div class="brand-sub">لتصليح وبيع الأجهزة والأرصدة - الزبير حي الشهداء</div>
          </div>
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px;">
            <div class="logo-badge">5G</div>
            <button class="btn-logout" onclick="handleLogout()">تسجيل الخروج</button>
          </div>
        </div>

        <div id="notif-status-box" class="notif-bar ${hasToken ? 'active' : 'inactive'}">
          ${hasToken 
            ? `<span>🔔 الإشعارات مفعلة على هذا الهاتف</span> <span>متصل</span>` 
            : `<span>🔕 الإشعارات غير مفعلة</span> <button class="btn-enable-notif" onclick="requestNotifPermission()">تفعيل الآن</button>`
          }
        </div>

        <div class="summary-grid">
          <div class="sum-card total">
            <div class="sum-label">المبلغ الكلي</div>
            <div class="sum-val"><span class="num">${totalAmount.toLocaleString()}</span> د.ع</div>
          </div>
          <div class="sum-card paid">
            <div class="sum-label">الواصل</div>
            <div class="sum-val"><span class="num">${totalPaid.toLocaleString()}</span> د.ع</div>
          </div>
          <div class="sum-card remaining">
            <div class="sum-label">المتبقي</div>
            <div class="sum-val"><span class="num">${remainingAmount.toLocaleString()}</span> د.ع</div>
          </div>
        </div>

        <div class="info-grid">
          <div class="info-box">
            <div class="box-head">👤 بيانات الزبون</div>
            <div class="info-row"><span class="lbl">الاسم:</span><span class="val">${name}</span></div>
            <div class="info-row"><span class="lbl">الهاتف:</span><span class="val"><span class="num">${phone}</span></span></div>
            <div class="info-row"><span class="lbl">العنوان:</span><span class="val">${address}</span></div>
          </div>

          <div class="info-box">
            <div class="box-head">📱 بيانات العقد</div>
            <div class="info-row"><span class="lbl">اسم المادة:</span><span class="val">${itemName}</span></div>
            <div class="info-row"><span class="lbl">تاريخ الشراء:</span><span class="val"><span class="num">${buyDate}</span></span></div>
            <div class="info-row"><span class="lbl">المقدمة:</span><span class="val"><span class="num">${downPayment.toLocaleString()}</span> د.ع</span></div>
          </div>
        </div>

        <div class="section-header">
          <span>جدول الأقساط والشداد:</span>
        </div>

        <div class="mobile-list">
          ${mobileCardsHtml}
        </div>

        <table class="desktop-table">
          <thead>
            <tr>
              <th>#</th>
              <th>تاريخ الاستحقاق</th>
              <th>تاريخ التسديد</th>
              <th>المبلغ</th>
              <th>المدفوع</th>
              <th>الحالة</th>
            </tr>
          </thead>
          <tbody>
            ${desktopRowsHtml}
          </tbody>
        </table>

        <div class="footer">
          نظام إدارة الأقساط الخاص بـ مركز الراشد
        </div>
      `;
    }

    // 5. التحكم ببنر التثبيت التلقائي بعد 5 ثوانٍ
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      
      setTimeout(() => {
        const banner = document.getElementById('pwa-install-banner');
        if (banner && deferredPrompt) {
          banner.style.display = 'flex';
        }
      }, 5000);
    });

    document.getElementById('btn-install-app')?.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
        document.getElementById('pwa-install-banner').style.display = 'none';
      }
    });

    document.getElementById('btn-close-banner')?.addEventListener('click', () => {
      document.getElementById('pwa-install-banner').style.display = 'none';
    });
  </script>
</body>
</html>
