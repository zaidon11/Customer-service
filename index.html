<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تقرير الأقساط - مركز الراشد</title>
  
  <!-- Firebase SDK Compatible -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --primary: #1e3a8a;
      --accent-purple: #6366f1;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      
      --blue-bg: #eff6ff;
      --blue-text: #1d4ed8;
      
      --green-bg: #f0fdf4;
      --green-text: #15803d;
      
      --red-bg: #fef2f2;
      --red-text: #b91c1c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text-dark); padding: 20px 10px; }

    .container { max-width: 750px; margin: 0 auto; background: var(--card-bg); padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }

    /* Top Header */
    .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px dashed var(--border); }
    .report-date { font-size: 0.85rem; color: var(--text-muted); }
    .report-date strong { display: block; color: var(--text-dark); margin-top: 4px; font-size: 0.95rem; }
    .brand-section { display: flex; align-items: center; gap: 15px; }
    .brand-info { text-align: left; }
    .brand-name { font-size: 1.6rem; font-weight: 800; color: #1e3a8a; }
    .brand-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
    .brand-logo { background: #0f172a; color: #38bdf8; font-weight: 900; font-size: 1.2rem; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }

    /* Info Cards Grid */
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
    .info-card { background: #fff; border: 1px solid #e0e7ff; border-radius: 12px; padding: 16px; position: relative; }
    .info-card::before { content: ''; position: absolute; top: 0; bottom: 0; right: 0; width: 4px; background: var(--accent-purple); border-radius: 0 12px 12px 0; }
    .card-title { font-size: 1rem; font-weight: 700; color: var(--accent-purple); margin-bottom: 12px; }
    .data-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem; }
    .data-row:last-child { margin-bottom: 0; }
    .data-label { color: var(--text-muted); }
    .data-val { font-weight: 700; color: var(--text-dark); text-align: left; }

    /* Totals Summary */
    .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 25px; }
    .sum-box { padding: 15px 10px; border-radius: 12px; text-align: center; border: 1px solid transparent; }
    .sum-box.blue { background: var(--blue-bg); border-color: #bfdbfe; color: var(--blue-text); }
    .sum-box.green { background: var(--green-bg); border-color: #bbf7d0; color: var(--green-text); }
    .sum-box.red { background: var(--red-bg); border-color: #fecaca; color: var(--red-text); }
    .sum-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; }
    .sum-value { font-size: 1.15rem; font-weight: 800; }

    /* Table Section */
    .table-title { font-size: 1.05rem; font-weight: 800; margin-bottom: 12px; color: var(--text-dark); }
    .table-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: center; font-size: 0.88rem; }
    th { background: #2563eb; color: #fff; padding: 10px 6px; font-weight: 700; }
    th:first-child { border-radius: 0 8px 8px 0; }
    th:last-child { border-radius: 8px 0 0 8px; }
    td { padding: 12px 6px; border-bottom: 1px solid var(--border); }
    tr:nth-child(even) td { background-color: #f8fafc; }
    
    .status-badge { display: inline-flex; align-items: center; justify-content: center; gap: 4px; font-weight: 700; padding: 4px 10px; border-radius: 6px; font-size: 0.82rem; }
    .status-paid { color: var(--green-text); background: var(--green-bg); }
    .status-due { color: var(--red-text); background: var(--red-bg); }

    /* Footer Branding */
    .report-footer { margin-top: 30px; padding-top: 15px; border-top: 1px dashed var(--border); display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); }

    .loading, .error-msg { text-align: center; padding: 50px 20px; font-weight: bold; }
    .error-msg { color: var(--red-text); }

    @media (max-width: 600px) {
      .container { padding: 15px; }
      .info-grid { grid-template-columns: 1fr; }
      .summary-grid { grid-template-columns: 1fr; }
      .brand-name { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

  <div class="container" id="app">
    <div class="loading">جاري تحميل تقرير الأقساط...</div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC6nz1_dENnayngLi1iiq8KDOKQmbfwNDI",
      authDomain: "rashedshopv1.firebaseapp.com",
      databaseURL: "https://rashedshopv1-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "rashedshopv1",
      storageBucket: "rashedshopv1.firebasestorage.app",
      messagingSenderId: "946603870783",
      appId: "1:946603870783:web:59aaa8549fab98635fc68a"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const appContainer = document.getElementById('app');

    const urlParams = new URLSearchParams(window.location.search);
    const customerId = urlParams.get('id');

    if (!customerId) {
      appContainer.innerHTML = `<div class="error-msg">الرابط غير صحيح أو ناقص.</div>`;
    } else {
      fetchCustomerData(customerId);
    }

    function fetchCustomerData(id) {
      // قراءة مسار الفايربيس الخاص بزبون محدد
      db.ref('customers/' + id).once('value')
        .then(snapshot => {
          if (!snapshot.exists()) {
            // محاولة مسار آخر في حال وجود عقدة أصلية
            return db.ref('installments/customers/' + id).once('value');
          }
          return snapshot;
        })
        .then(snapshot => {
          if (!snapshot || !snapshot.exists()) {
            appContainer.innerHTML = `<div class="error-msg">لم يتم العثور على حساب بهذا الرمز.</div>`;
            return;
          }
          renderCustomerPortal(snapshot.val());
        })
        .catch(error => {
          console.error(error);
          appContainer.innerHTML = `<div class="error-msg">حدث خطأ أثناء تحميل البيانات.</div>`;
        });
    }

    // تنسيق التاريخ من timestamp أو نص
    function formatDate(dateVal) {
      if (!dateVal || dateVal === '--') return '--';
      if (typeof dateVal === 'number' || !isNaN(dateVal)) {
        const d = new Date(Number(dateVal));
        if (!isNaN(d.getTime())) {
          return d.toISOString().split('T')[0];
        }
      }
      return dateVal;
    }

    function renderCustomerPortal(data) {
      // قراءة البيانات بالأسماء الدقيقة من الفايربيس
      const name = data.name || 'غير محدد';
      const phone = data.phone || 'غير محدد';
      const address = data.address || 'الزبير - حي الشهداء';
      
      const itemName = data.model || 'غير محدد';
      const buyDate = formatDate(data.purchaseDate);
      const downPayment = Number(data.firstPay || 0);

      const totalAmount = Number(data.total || 0);
      
      // حساب الأقساط
      let monthsList = [];
      if (data.months) {
        monthsList = Array.isArray(data.months) ? data.months : Object.values(data.months);
      }

      let totalPaidFromMonths = 0;
      let rowsHtml = '';

      // سطر المقدمة
      if (downPayment > 0) {
        rowsHtml += `
          <tr>
            <td>--</td>
            <td>${buyDate}</td>
            <td>${buyDate}</td>
            <td>المقدمة</td>
            <td>${downPayment.toLocaleString()} د.ع</td>
            <td><span class="status-badge status-paid">✓ مدفوع</span></td>
          </tr>
        `;
      }

      // حساب جدول الأقساط
      monthsList.forEach((m) => {
        const reqAmount = Number(m.required || m.amount || 0);
        const remAmount = Number(m.remaining !== undefined ? m.remaining : reqAmount);
        const paidForThisMonth = reqAmount - remAmount;
        
        totalPaidFromMonths += paidForThisMonth;

        const dueDateFormatted = formatDate(m.dueDate);
        const isPaid = (m.status && m.status.toLowerCase() === 'paid') || remAmount === 0;
        const isPartiallyPaid = paidForThisMonth > 0 && remAmount > 0;

        let statusHtml = '';
        if (isPaid) {
          statusHtml = `<span class="status-badge status-paid">✓ مدفوع</span>`;
        } else if (isPartiallyPaid) {
          statusHtml = `<span class="status-badge status-paid">جزئي</span>`;
        } else {
          statusHtml = `<span class="status-badge status-due">مستحق</span>`;
        }

        const payDateFormatted = isPaid ? (formatDate(m.paidAt) || dueDateFormatted) : '--';

        rowsHtml += `
          <tr>
            <td>${m.monthNumber || '--'}</td>
            <td>${dueDateFormatted}</td>
            <td>${payDateFormatted}</td>
            <td>${reqAmount.toLocaleString()} د.ع</td>
            <td>${paidForThisMonth.toLocaleString()} د.ع</td>
            <td>${statusHtml}</td>
          </tr>
        `;
      });

      const totalPaid = downPayment + totalPaidFromMonths;
      const remainingAmount = totalAmount - totalPaid;

      const reportDate = new Date().toISOString().split('T')[0];

      appContainer.innerHTML = `
        <div class="top-header">
          <div class="report-date">
            تاريخ التقرير
            <strong>${reportDate}</strong>
          </div>
          <div class="brand-section">
            <div class="brand-info">
              <div class="brand-name">مركز الراشد</div>
              <div class="brand-sub">لتصليح وبيع الأجهزة والأرصدة - الزبير حي الشهداء</div>
            </div>
            <div class="brand-logo">5G</div>
          </div>
        </div>

        <div class="info-grid">
          <div class="info-card">
            <div class="card-title">بيانات الزبون</div>
            <div class="data-row"><span class="data-label">الاسم:</span><span class="data-val">${name}</span></div>
            <div class="data-row"><span class="data-label">الهاتف:</span><span class="data-val">${phone}</span></div>
            <div class="data-row"><span class="data-label">العنوان:</span><span class="data-val">${address}</span></div>
          </div>

          <div class="info-card">
            <div class="card-title">بيانات العقد</div>
            <div class="data-row"><span class="data-label">اسم المادة:</span><span class="data-val">${itemName}</span></div>
            <div class="data-row"><span class="data-label">تاريخ الشراء:</span><span class="data-val">${buyDate}</span></div>
            <div class="data-row"><span class="data-label">المقدمة:</span><span class="data-val">${downPayment.toLocaleString()} د.ع</span></div>
          </div>
        </div>

        <div class="summary-grid">
          <div class="sum-box blue">
            <div class="sum-title">المبلغ الكلي</div>
            <div class="sum-value">${totalAmount.toLocaleString()} د.ع</div>
          </div>
          <div class="sum-box green">
            <div class="sum-title">المدفوع</div>
            <div class="sum-value">${totalPaid.toLocaleString()} د.ع</div>
          </div>
          <div class="sum-box red">
            <div class="sum-title">المتبقي</div>
            <div class="sum-value">${remainingAmount.toLocaleString()} د.ع</div>
          </div>
        </div>

        <div class="table-title">جدول الأقساط:</div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>تاريخ الاستحقاق</th>
                <th>تاريخ التسديد</th>
                <th>المبلغ</th>
                <th>المدفوع</th>
                <th>الحالة</th>
              </tr>
            </thead>
            <tbody>
              ${rowsHtml}
            </tbody>
          </table>
        </div>

        <div class="report-footer">
          <span>أقساط بلس - نظام إدارة الأقساط</span>
          <span>نعتز بتقتكم بنا - مركز الراشد</span>
        </div>
      `;
    }
  </script>
</body>
</html>
